[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-cheduler"
version = "0.1.0"
description = "Closed-loop feedback scheduling service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "confluent-kafka>=2.6,<3.0",
  "fastapi>=0.116,<1.0",
  "joblib>=1.4,<2.0",
  "jsonschema>=4.23,<5.0",
  "matplotlib>=3.10,<4.0",
  "numpy>=2.1,<3.0",
  "networkx>=3.4,<4.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<3.0",
  "scipy>=1.14,<2.0",
  "scikit-learn>=1.6,<2.0",
  "PyMySQL>=1.1,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "xlrd>=2.0,<3.0",
]

[project.scripts]
smart-cheduler-xrd = "app.xrd_cli:main"
smart-cheduler-mat-model = "mat_model.cli:main"
smart-cheduler-mat-batch = "mat_model.select_batch_cli:main"
smart-cheduler-workflows = "app.workflows.initialize:main"
smart-cheduler-workflow-worker = "app.workflows.worker:main"

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*", "mat_model*"]
